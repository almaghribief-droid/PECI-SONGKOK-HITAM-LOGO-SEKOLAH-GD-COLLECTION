services:
  - type: web
    name: gd-smart-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gd-smart-assistant-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
databases:
  - name: gd-smart-assistant-db
    databaseName: gdsmartassistant
    user: gdsmartassistant
