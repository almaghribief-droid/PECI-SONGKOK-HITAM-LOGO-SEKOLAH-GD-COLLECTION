name: Build GD PRINT 80 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-gd-print-80/**'
      - '.github/workflows/build-gd-print-80.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-gd-print-80
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GD-PRINT-80-debug
          path: android-gd-print-80/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
