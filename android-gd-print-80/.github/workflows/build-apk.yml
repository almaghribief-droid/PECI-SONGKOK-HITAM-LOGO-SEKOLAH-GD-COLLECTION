name: Build GD PRINT 80 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-gd-print-80/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android-gd-print-80
        run: |
          gradle --version
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GD-PRINT-80-debug
          path: android-gd-print-80/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
